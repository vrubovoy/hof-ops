[defaults]
# The baked-in, signed roles - never an operator-supplied or live-
# mounted roles path (see the Dockerfile's own comment on why).
roles_path = /ansible/roles
collections_path = /usr/share/ansible/collections

# hofctl apply's own operation journal (see ADR 0004/schemas/
# operation-event-v1.schema.json) is the durable, structured record of
# what happened - Ansible's own retry-file mechanism would just be a
# second, inconsistent copy of the same information in a cruder format.
retry_files_enabled = False

# No arbitrary host key auto-acceptance here - target-inspector.mjs's
# own hardened SSH transport (exact host-key binding, see ADR 0004) is
# the only thing that ever establishes trust in the target; Ansible
# itself connects over a connection hofctl apply already authenticated,
# never independently negotiating trust of its own.
host_key_checking = True

[ssh_connection]
pipelining = True
