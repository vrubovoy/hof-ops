---
# host.prepare - always the first operation of a bootstrap plan (see
# plan.mjs's own buildOperations) - no per-invocation identity of its
# own beyond the fixed resource name "host". Ensures python3 is present
# (a genuinely clean host may not have it - every other module in this
# whole Execution Environment needs it), the fixed Hof directory layout
# under /etc/hof and /var/lib/hof, and Docker Engine + the Compose
# plugin (only when target-inspector.mjs's own Docker-absent probe - see
# ADR 0004 - already confirmed it isn't there yet; installing it again
# over an existing install is simply a no-op apt run).
hof_operation_id: null
