---
# Skeleton only (item 8, PR #26) - real host.prepare implementation
# lands in PR #28. Every role in this Execution Environment enforces
# its own operation's variable contract even before it does real work,
# so a caller (hofctl apply's own dispatcher, PR #27) that got the
# typed operation-to-role mapping wrong fails loudly here, not deep
# inside a half-applied task.
- name: Assert this operation's own identity is present
  ansible.builtin.assert:
    that:
      - hof_operation_id is not none
    fail_msg: "host role requires hof_operation_id (the bound plan-v2 operation's own id) - never invoked without it"

- name: host.prepare is not yet implemented
  ansible.builtin.debug:
    msg: >-
      host.prepare skeleton reached for operation {{ hof_operation_id }} -
      real host preparation (OS baseline, Docker Engine/Compose install
      when genuinely absent, the fixed /etc/hof and /var/lib/hof
      directory layout) lands in a later item-8 PR.
