---
- name: Assert this operation's own required variables are present
  ansible.builtin.assert:
    that:
      - hof_operation_id is not none
    fail_msg: "host role requires hof_operation_id - never invoked without it"

# A genuinely clean bootstrap target may not have python3 at all - every
# other module in this role (and every other role in this Execution
# Environment) needs it. `raw` is the one task in the whole image that
# runs without an interpreter on the target at all, exactly so it can
# install the interpreter everything else depends on.
- name: Bootstrap python3 if the target doesn't have it yet
  ansible.builtin.raw: command -v python3 >/dev/null 2>&1 || (apt-get update && apt-get install -y python3)
  changed_when: false

- name: Gather the facts this role's own OS-specific Docker install needs
  ansible.builtin.setup:
    gather_subset: min

- name: Refuse an unsupported OS - hofctl preflight's own checkOs already scoped this platform to Debian/Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ["Debian", "Ubuntu"]
    fail_msg: "host.prepare only supports Debian or Ubuntu, found {{ ansible_facts.distribution }}"

- name: Fixed Hof directory layout
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/hof, mode: "0755" }
    - { path: /etc/hof/generated, mode: "0755" }
    - { path: /etc/hof/secrets, mode: "0700" }
    - { path: /var/lib/hof, mode: "0755" }
    - { path: /var/lib/hof/state, mode: "0755" }
    - { path: /var/lib/hof/state/journal, mode: "0755" }
  loop_control:
    label: "{{ item.path }}"

- name: Check whether Docker is already installed
  ansible.builtin.command: docker --version
  register: hof_docker_check
  changed_when: false
  failed_when: false

# Checked independently of Engine's own presence - a target can genuinely
# have Docker Engine already installed (from an image, a different
# playbook, a manual install) with the Compose plugin specifically
# missing, e.g. an Engine-only install predating the plugin, or one that
# used docker-compose (the old standalone binary) instead. The original
# recipe only ever checked for this inside the "Engine absent" branch
# below, so that real case was silently never fixed.
- name: Check whether the Docker Compose plugin is already installed
  ansible.builtin.command: docker compose version
  register: hof_compose_check
  changed_when: false
  failed_when: false

# community.docker's own modules (volume/network/image roles) run
# their own Python code ON THIS TARGET, against its own local Docker
# socket - not from the Execution Environment container talking to a
# remote API. They need the Docker Python SDK (and its own
# dependency, requests) installed here, regardless of whether Docker
# itself needed a fresh install just above - a target that already had
# Docker from a previous install may still be missing this. Found for
# real via a genuine CI failure ("Failed to import the required Python
# library (requests)"), not assumed.
- name: The Docker Python SDK, for every community.docker module this Execution Environment runs against this target
  ansible.builtin.apt:
    name: python3-docker
    state: present
    update_cache: true

# Only ever runs when target-inspector.mjs's own probe already
# positively confirmed Docker is absent (see ADR 0004's "Docker Absent"
# rules) - this second, independent check (docker --version, right here
# on the target) is a real, current-moment confirmation of the same
# fact, not a re-trust of a possibly-stale plan. Also runs whenever the
# Compose plugin alone is missing (a target with Engine already present
# but no Docker apt repository configured yet still needs it, to
# install just the plugin below).
- name: Docker's own apt repository (needed whenever Engine or the Compose plugin alone is missing)
  when: hof_docker_check.rc != 0 or hof_compose_check.rc != 0
  block:
    - name: Docker's own prerequisites
      ansible.builtin.apt:
        # python3-debian is deb822_repository's own dependency (its
        # Python "debian" module), not Docker's - needed on the target
        # for the repository task right below this block to run at all.
        name: [ca-certificates, curl, gnupg, python3-debian]
        state: present
        update_cache: true

    - name: /etc/apt/keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Docker's own signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Docker's own apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
        suites: "{{ ansible_facts.distribution_release }}"
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc

- name: Docker Engine, CLI, and containerd (only when genuinely absent)
  when: hof_docker_check.rc != 0
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io]
    state: present
    update_cache: true

# Deliberately its own task, independent of the Engine-absent condition
# above - a target whose Engine already worked but never had the plugin
# (see this file's own check right below hof_docker_check) must still
# get it installed here, not silently skipped because Engine itself
# didn't need a fresh install.
- name: Docker Compose plugin (only when genuinely absent)
  when: hof_compose_check.rc != 0
  ansible.builtin.apt:
    name: docker-compose-plugin
    state: present
    update_cache: true

# Deliberately unconditional - a further, 2026-08-31 review found this
# gated on `hof_docker_check.rc != 0` (Engine genuinely absent before
# this run), silently leaving an already-installed-but-disabled-or-
# stopped Docker service untouched (a real, plausible case: an image
# with docker.service masked, or a prior manual `systemctl disable
# docker`). `ansible.builtin.systemd` with enabled/state already
# reports changed: false when nothing needed doing, so running this
# unconditionally costs nothing on the common already-fine case.
- name: Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
