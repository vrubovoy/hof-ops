---
# image.verify / image.pull share this one role - hof_image_action
# ("verify"|"pull") is how a single invocation tells them apart (both
# actions carry the same hof_image_reference/hof_image_trust shape,
# see plan-v2.schema.json's own operation.imageTrust: {policy: signed,
# signatureIdentity, signatureOidcIssuer} or {policy: digest-only}, and
# apply.mjs's own ACTION_TO_ROLE mapping dispatches both into this
# role). Never re-derived from the release lock on the target - the
# plan itself already carried the exact trust policy to use.
hof_operation_id: null
hof_image_action: null
hof_image_reference: null
hof_image_trust: null
