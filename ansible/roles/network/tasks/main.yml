---
- name: Assert this operation's own required variables are present
  ansible.builtin.assert:
    that:
      - hof_operation_id is not none
      - hof_network_name is not none
      - hof_installation_id is not none
      - hof_generation is not none
    fail_msg: "network role requires hof_operation_id, hof_network_name, hof_installation_id, hof_generation - never invoked without them"

- name: Ensure this named, Hof-labeled Docker network exists
  community.docker.docker_network:
    name: "{{ hof_network_name }}"
    labels:
      hof.managed: "true"
      hof.installation-id: "{{ hof_installation_id }}"
      hof.generation: "{{ hof_generation }}"
      hof.kind: network
      hof.resource: "{{ hof_network_name }}"
    state: present
