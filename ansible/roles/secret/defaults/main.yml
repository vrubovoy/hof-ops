# secret.ensure - discovered against the real plan.mjs (PR #27) to be
# ONE coarse operation per bootstrap (resource: "secrets.sops.yaml"),
# not one per secret name as this role's PR #26 skeleton first assumed
# (see scripts/secrets.mjs's own requiredSecrets/ensureSecrets, which
# already operate on the whole store in a single pass, not per-secret) -
# corrected here rather than carried forward as a contract nothing could
# actually satisfy.
# Real implementation (PR #28): delivers every secret this deployment
# needs to its own fixed target-side file path (/etc/hof/secrets/<name>,
# see render-topology.mjs's own wireSecret()), 0400, owned by the
# Compose-invoking user. How the decrypted values themselves reach this
# role safely (no_log discipline, never landing in a journal or a plain
# extra-vars log) is still open and is PR #28's own design decision, not
# fixed here.
hof_operation_id: null
hof_secrets_store: null
