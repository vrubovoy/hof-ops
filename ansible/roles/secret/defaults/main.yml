---
# secret.ensure - delivers every secret this deployment needs to its own
# fixed target-side file path (/etc/hof/secrets/<name>, see
# render-topology.mjs's own wireSecret() - Compose's own `secrets:`
# mechanism reads from there, at container-start time, as the docker
# daemon itself - root, never the Compose-invoking user directly).
#
# hof_secrets_file is a path INSIDE THIS CONTAINER (never on the
# target) to a plaintext {name: value} JSON blob apply.mjs decrypted on
# the operator's own workstation (via scripts/secrets.mjs's
# readSecretsStore(), a real `sops --decrypt`) and mounted in
# read-only, once, for this one operation's own docker run - the values
# themselves never appear in extra-vars, the operation journal, or any
# other apply.mjs-owned channel; ansible.builtin.copy transfers each
# one to the target over the ordinary SSH/SFTP connection instead.
hof_operation_id: null
hof_secrets_file: null
