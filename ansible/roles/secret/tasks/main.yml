---
- name: Assert this operation's own required variables are present
  ansible.builtin.assert:
    that:
      - hof_operation_id is not none
      - hof_secrets_file is not none
    fail_msg: "secret role requires hof_operation_id, hof_secrets_file - never invoked without them"

# Read once, on the control node (this container) - never logged, never
# echoed into a task result. lookup('file', ...) reads locally (inside
# this container, where hof_secrets_file was mounted), not on the
# remote target.
- name: Read the decrypted secrets this deployment needs
  ansible.builtin.set_fact:
    hof_secrets_map: "{{ lookup('file', hof_secrets_file) | from_json }}"
  no_log: true

# ansible.builtin.copy's own `content:` transfers the value over the
# normal SSH/SFTP connection, the same channel every other file this
# role's siblings write already uses - never a second, ad hoc channel,
# and never through extra-vars/argv (which a real `docker inspect` or
# `ps` on the machine running this container could otherwise observe).
#
# mode 0444 (world-readable), not the tighter 0400 this used to be: a
# 2026-08-28 review found a real gap - Compose's own file-based
# `secrets:` provider is a plain bind-mount (never a Swarm-style
# tmpfs distribution with fixed in-container permissions), so a
# consuming container sees this file's HOST-side owner/mode exactly as
# written. 0400 root-owned is invisible to any container whose own main
# process isn't root - a real, deployable case (Wächter's own agent
# runs `USER node`, since it also holds the Docker socket and is
# deliberately never given root). World-readable is safe here
# specifically because the directory it lives in, /etc/hof/secrets, is
# itself mode 0700 (see the host role) - a bind-mounted container never
# needs to traverse that directory at all (the mount is resolved once,
# by the root Docker daemon, before the container's own mount namespace
# ever sees a path), so only a container this file was actually
# bind-mounted into can ever read it; any OTHER local process on the
# real target - a non-root user with a shell, say - still can't even
# list or enter the directory to get at the file directly.
- name: Deliver each secret to its own fixed target-side file
  ansible.builtin.copy:
    content: "{{ hof_secrets_map[item] }}"
    dest: "/etc/hof/secrets/{{ item }}"
    owner: root
    group: root
    mode: "0444"
  loop: "{{ hof_secrets_map.keys() | list }}"
  no_log: true
