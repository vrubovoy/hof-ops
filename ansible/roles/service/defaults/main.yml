---
# service.start/service.stop/service.remove - one Compose unit at a
# time, scoped strictly to it (never a blanket `compose up`/
# `compose down` for the whole stack, never a volume removal of any
# kind). Item 9 (ADR 0005) added stop/remove - applied-mode-only
# (bootstrap-actions.mjs's own whitelist has no such action at all,
# only applied-actions.mjs's does), used for drift repair (a missing
# container's own repair still starts it fresh via start; a manually
# swapped one is stopped+removed then recreated) and for a disabled
# service's own real removal.
#
# hof_service_image is carried for audit/journal purposes on a start
# (the exact pinned reference this operation approved) but never
# passed directly to `docker compose up` - the compose.yml config.write
# already delivered to /etc/hof/generated/compose.yml already declares
# this exact same image for this unit (image.pull already pulled it in
# an earlier operation), so Compose's own service definition is already
# correct; passing it again here would just be a second, independently-
# maintained copy of the same fact.
#
# hof_installation_id is required for stop/remove only (never for
# start, which never needs to discover anything - it acts on the unit
# name Compose itself already knows) - discovery there must scope to
# exactly this installation, never a foreign one that happens to share
# a host and a unit name.
hof_operation_id: null
hof_service_action: null
hof_service_unit: null
hof_service_image: null
hof_installation_id: null
