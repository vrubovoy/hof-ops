---
- name: Assert this operation's own required variables are present
  ansible.builtin.assert:
    that:
      - hof_operation_id is not none
      - hof_service_unit is not none
      - hof_service_image is not none
    fail_msg: "service role requires hof_operation_id, hof_service_unit, hof_service_image - never invoked without them"

# --no-deps: scoped strictly to this one unit, exactly like this role's
# own defaults/main.yml comment promises - every OTHER unit that needs
# starting gets its own separate service.start operation from plan.mjs,
# never implicitly pulled in as a Compose dependency here.
# --pull never: image.pull already pulled the exact digest-pinned image
# an earlier operation in this same plan - Compose must use exactly
# that, never silently fetch something else at this stage.
- name: Start this one Compose unit
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - /etc/hof/generated/compose.yml
      - up
      - --detach
      - --no-deps
      - --pull
      - "never"
      - "{{ hof_service_unit }}"
  changed_when: true
