---
# state.commit - always the last operation in any plan, only once every
# prior operation has already succeeded (see plan.mjs's own
# buildOperations ordering). Writes /var/lib/hof/state/current.json and
# topology.json atomically (ansible.builtin.copy's own write-then-rename
# semantics - see ADR 0004) - a host must never be observable with
# Docker resources but no committed generation.
#
# hof_state_dir is a path INSIDE THIS CONTAINER (never on the target) to
# a directory apply.mjs wrote the real current.json/topology.json
# content into (see schemas/state-v1.schema.json and state.mjs's own
# assertRenderedShape for their two very different shapes) - mounted
# read-only, once, for this one operation. Item 9 (ADR 0005): the same
# directory also carries release-lock.json - the exact release lock
# this commit was applied under - used only for this role's own
# immutable per-generation snapshot (generations/NNNNNN/*), never for
# the two pointer files themselves.
hof_operation_id: null
hof_state_generation: null
hof_state_dir: null
