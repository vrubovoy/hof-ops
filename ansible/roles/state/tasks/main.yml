---
- name: Assert this operation's own required variables are present
  ansible.builtin.assert:
    that:
      - hof_operation_id is not none
      - hof_state_generation is not none
      - hof_state_dir is not none
    fail_msg: "state role requires hof_operation_id, hof_state_generation, hof_state_dir - never invoked without them"

# Parsed once, used only for this one cross-check - the actual delivery
# below reads current.json directly by its own real file bytes (via
# copy's own src:, never routed through this parsed value or any other
# Jinja round-trip - confirmed for real that set_fact + a templated
# lookup() auto-coerces JSON-looking content into a native dict, which
# would otherwise silently re-serialize the file's own exact bytes
# rather than deliver them unchanged).
- name: Read current.json's own generation for a cross-check
  ansible.builtin.set_fact:
    hof_state_current_generation: "{{ (lookup('file', hof_state_dir + '/current.json') | from_json).generation }}"

- name: Cross-check the delivered current.json's own generation against this operation's own carried value
  ansible.builtin.assert:
    # | int on both sides - set_fact's own Jinja templating stringifies
    # a plain numeric result (confirmed for real: both sides otherwise
    # print identically as "1" yet still compare unequal, a real "1" ==
    # "1" string against a genuine int 1) unless explicitly cast back.
    that:
      - (hof_state_current_generation | int) == (hof_state_generation | int)
    fail_msg: >-
      current.json's own generation ({{ hof_state_current_generation }})
      does not match this operation's own hof_state_generation ({{ hof_state_generation }})

# Item 9 (ADR 0005): an immutable, permanent per-generation snapshot -
# {state,topology,release-lock}.json - published under
# /var/lib/hof/state/generations/NNNNNN/ BEFORE either pointer file
# below is touched (the pointer files' own ADR-0004 ordering -
# topology.json first, current.json last - is otherwise unchanged).
# Zero-padded to 6 digits; the generation itself is arbitrary and
# positive (bootstrap always commits 1, an applied commit always N+1
# for whatever N was already on disk - never a fixed constant here).
- name: Compute this generation's own immutable snapshot directory
  ansible.builtin.set_fact:
    hof_state_generation_dir: "/var/lib/hof/state/generations/{{ '%06d' | format(hof_state_generation | int) }}"

- name: Check whether this generation's own snapshot directory already exists
  ansible.builtin.stat:
    path: "{{ hof_state_generation_dir }}/state.json"
  register: hof_state_generation_snapshot_stat

# A repeat of the exact same commit (a retried/resumed operation) must
# be idempotent; an existing generation number with genuinely DIFFERENT
# content is corruption - a generation number must never be reused for
# two different real commits - and is a hard failure here, never a
# silent overwrite of an immutable record. appliedAt is excluded from
# the comparison, exactly like apply.mjs's own succeeded-journal
# recovery check (scripts/apply.mjs) - it is never expected to be
# identical across two separate attempts at committing the SAME
# generation, and comparing it would make a genuine, harmless retry
# fail this check for the wrong reason.
- name: Compare an already-existing snapshot's own state.json against what this operation is about to write
  when: hof_state_generation_snapshot_stat.stat.exists
  block:
    - name: Read the already-existing snapshot's own state.json (appliedAt excluded)
      ansible.builtin.set_fact:
        hof_state_generation_existing: "{{ (lookup('file', hof_state_generation_dir + '/state.json') | from_json) | combine({'appliedAt': 'ignored-for-this-comparison'}) }}"
    - name: Read what this operation is about to write (appliedAt excluded)
      ansible.builtin.set_fact:
        hof_state_generation_incoming: "{{ (lookup('file', hof_state_dir + '/current.json') | from_json) | combine({'appliedAt': 'ignored-for-this-comparison'}) }}"
    - name: Refuse to overwrite an existing generation snapshot with different content
      ansible.builtin.assert:
        that:
          - hof_state_generation_existing == hof_state_generation_incoming
        fail_msg: >-
          generation {{ hof_state_generation }} already has an immutable snapshot on this target, and its
          content (excluding appliedAt, which never matches across a retry) does not match what this
          operation is about to commit - a generation number must never be reused for two different
          commits; this is refused, never overwritten

- name: Create this generation's own immutable snapshot directory
  when: not hof_state_generation_snapshot_stat.stat.exists
  ansible.builtin.file:
    path: "{{ hof_state_generation_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write this generation's own immutable state.json snapshot
  when: not hof_state_generation_snapshot_stat.stat.exists
  ansible.builtin.copy:
    src: "{{ hof_state_dir }}/current.json"
    dest: "{{ hof_state_generation_dir }}/state.json"
    owner: root
    group: root
    mode: "0444"

- name: Write this generation's own immutable topology.json snapshot
  when: not hof_state_generation_snapshot_stat.stat.exists
  ansible.builtin.copy:
    src: "{{ hof_state_dir }}/topology.json"
    dest: "{{ hof_state_generation_dir }}/topology.json"
    owner: root
    group: root
    mode: "0444"

- name: Write this generation's own immutable release-lock.json snapshot
  when: not hof_state_generation_snapshot_stat.stat.exists
  ansible.builtin.copy:
    src: "{{ hof_state_dir }}/release-lock.json"
    dest: "{{ hof_state_generation_dir }}/release-lock.json"
    owner: root
    group: root
    mode: "0444"

# ansible.builtin.copy's own src: reads the file's exact bytes directly
# (on the control node, where hof_state_dir was mounted) and writes
# atomically (a same-filesystem temp file, then an atomic rename into
# place) - no separate hand-rolled temp-file dance, and no Jinja
# round-trip through the file's own content at all. Order matters:
# topology.json first, then current.json last - state.mjs's own
# resolveBaseline() treats current.json's mere presence as "this
# installation is applied", so it must never appear before topology.json
# already does (the exact corruption case resolveBaseline() itself
# refuses to guess about: "has current.json but no topology.json").
- name: Atomically write topology.json
  ansible.builtin.copy:
    src: "{{ hof_state_dir }}/topology.json"
    dest: /var/lib/hof/state/topology.json
    owner: root
    group: root
    mode: "0644"

- name: Atomically write current.json (deliberately last)
  ansible.builtin.copy:
    src: "{{ hof_state_dir }}/current.json"
    dest: /var/lib/hof/state/current.json
    owner: root
    group: root
    mode: "0644"
