---
- name: Assert this operation's own required variables are present
  ansible.builtin.assert:
    that:
      - hof_operation_id is not none
      - hof_state_generation is not none
      - hof_state_dir is not none
    fail_msg: "state role requires hof_operation_id, hof_state_generation, hof_state_dir - never invoked without them"

# Parsed once, used only for this one cross-check - the actual delivery
# below reads current.json directly by its own real file bytes (via
# copy's own src:, never routed through this parsed value or any other
# Jinja round-trip - confirmed for real that set_fact + a templated
# lookup() auto-coerces JSON-looking content into a native dict, which
# would otherwise silently re-serialize the file's own exact bytes
# rather than deliver them unchanged).
- name: Read current.json's own generation for a cross-check
  ansible.builtin.set_fact:
    hof_state_current_generation: "{{ (lookup('file', hof_state_dir + '/current.json') | from_json).generation }}"

- name: Cross-check the delivered current.json's own generation against this operation's own carried value
  ansible.builtin.assert:
    # | int on both sides - set_fact's own Jinja templating stringifies
    # a plain numeric result (confirmed for real: both sides otherwise
    # print identically as "1" yet still compare unequal, a real "1" ==
    # "1" string against a genuine int 1) unless explicitly cast back.
    that:
      - (hof_state_current_generation | int) == (hof_state_generation | int)
    fail_msg: >-
      current.json's own generation ({{ hof_state_current_generation }})
      does not match this operation's own hof_state_generation ({{ hof_state_generation }})

# Item 9 (ADR 0005): an immutable, permanent per-generation snapshot -
# {state,topology,release-lock}.json - published under
# /var/lib/hof/state/generations/NNNNNN/ BEFORE either pointer file
# below is touched (the pointer files' own ADR-0004 ordering -
# topology.json first, current.json last - is otherwise unchanged).
# Zero-padded to 6 digits; the generation itself is arbitrary and
# positive (bootstrap always commits 1, an applied commit always N+1
# for whatever N was already on disk - never a fixed constant here).
#
# Item 9 review fix (finding 1): the snapshot directory is now published
# ATOMICALLY. Every file is written into a unique, operation-scoped
# STAGING directory on the target first, the staging directory is
# verified complete and non-empty, and only then is the whole directory
# renamed into its final generations/NNNNNN/ place in a single
# rename(2). A crash at any point before that rename leaves nothing but
# an orphan staging directory (removed on the next attempt); it can
# never leave a half-populated generations/NNNNNN/ that the old
# "state.json exists" check would have accepted as a complete immutable
# record. The retry / resume idempotency comparison is also done
# TARGET-side now (ansible.builtin.slurp), never a controller-side
# lookup('file') of a path that only exists on the target - the old
# code did exactly that and every retry crashed on it.
- name: Compute this generation's own immutable snapshot directories
  ansible.builtin.set_fact:
    hof_state_generation_dir: "/var/lib/hof/state/generations/{{ '%06d' | format(hof_state_generation | int) }}"
    hof_state_generation_staging_dir: "/var/lib/hof/state/generations/.staging-{{ hof_operation_id }}-{{ '%06d' | format(hof_state_generation | int) }}"

- name: Check whether this generation's own snapshot directory already exists
  ansible.builtin.stat:
    path: "{{ hof_state_generation_dir }}"
  register: hof_state_generation_snapshot_stat

# A repeat of the exact same commit (a retried/resumed operation) must
# be idempotent; an existing generation directory that is INCOMPLETE (a
# crashed earlier publish that predates the atomic-staging fix, or
# tampering) is corruption of an immutable record and is never repaired
# in place. An existing, complete generation directory whose content
# DIFFERS from what this operation is about to write is also corruption
# - a generation number must never be reused for two different real
# commits. appliedAt is excluded from the comparison, exactly like
# apply.mjs's own succeeded-journal recovery check - it is never
# expected to be identical across two separate attempts at committing
# the SAME generation.
- name: Verify an already-published generation snapshot is complete and matches
  when: hof_state_generation_snapshot_stat.stat.exists
  block:
    - name: Stat the already-published snapshot's own three files
      ansible.builtin.stat:
        path: "{{ hof_state_generation_dir }}/{{ item }}"
      loop:
        - state.json
        - topology.json
        - release-lock.json
      register: hof_state_generation_existing_files
    - name: Refuse a generation directory that exists but is incomplete
      ansible.builtin.assert:
        that:
          - hof_state_generation_existing_files.results | map(attribute='stat.exists') | min
          - (hof_state_generation_existing_files.results | map(attribute='stat.size') | min) > 0
        fail_msg: >-
          generation {{ hof_state_generation }} already has a snapshot directory on this target, but it
          is incomplete (a crashed earlier publish) - this is corruption of an immutable record and is
          never repaired in place; investigate the target directly
    # Item 9 SECOND review fix (finding 3): all THREE files are compared
    # now, not just state.json - a review found topology.json and
    # release-lock.json could be parseable, non-empty, and still belong
    # to a genuinely different commit than the one already on disk,
    # slipping past a check that only ever looked at state.json's own
    # content. Read TARGET-side (slurp), never a controller-side
    # lookup('file') of a target-only generations/ path (see this file's
    # own top comment on why).
    - name: Read the already-published snapshot's own three files (TARGET-side)
      ansible.builtin.slurp:
        src: "{{ hof_state_generation_dir }}/{{ item }}"
      loop:
        - state.json
        - topology.json
        - release-lock.json
      register: hof_state_generation_existing_raw
    - name: Read what this operation is about to write
      ansible.builtin.set_fact:
        # appliedAt is the one field excluded from the comparison on
        # purpose - state.json's own commit timestamp is never expected
        # to be identical across two separate attempts at committing the
        # SAME generation. topology.json/release-lock.json carry no such
        # field at all, so nothing is excluded for them.
        hof_state_generation_existing_state: "{{ (hof_state_generation_existing_raw.results[0].content | b64decode | from_json) | combine({'appliedAt': 'ignored-for-this-comparison'}) }}"
        hof_state_generation_existing_topology: "{{ hof_state_generation_existing_raw.results[1].content | b64decode | from_json }}"
        hof_state_generation_existing_release_lock: "{{ hof_state_generation_existing_raw.results[2].content | b64decode | from_json }}"
        hof_state_generation_incoming_state: "{{ (lookup('file', hof_state_dir + '/current.json') | from_json) | combine({'appliedAt': 'ignored-for-this-comparison'}) }}"
        hof_state_generation_incoming_topology: "{{ lookup('file', hof_state_dir + '/topology.json') | from_json }}"
        hof_state_generation_incoming_release_lock: "{{ lookup('file', hof_state_dir + '/release-lock.json') | from_json }}"
    - name: Refuse to overwrite an existing generation snapshot with different content
      ansible.builtin.assert:
        that:
          - hof_state_generation_existing_state == hof_state_generation_incoming_state
          - hof_state_generation_existing_topology == hof_state_generation_incoming_topology
          - hof_state_generation_existing_release_lock == hof_state_generation_incoming_release_lock
        fail_msg: >-
          generation {{ hof_state_generation }} already has an immutable snapshot on this target, and at
          least one of its three files (excluding state.json's own appliedAt, which never matches across
          a retry) does not match what this operation is about to commit - a generation number must never
          be reused for two different commits; this is refused, never overwritten

- name: Publish this generation's own immutable snapshot atomically
  when: not hof_state_generation_snapshot_stat.stat.exists
  block:
    - name: Remove any orphan staging directory left by a crashed earlier attempt
      ansible.builtin.file:
        path: "{{ hof_state_generation_staging_dir }}"
        state: absent

    - name: Create a fresh, operation-scoped staging directory
      ansible.builtin.file:
        path: "{{ hof_state_generation_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ansible.builtin.copy's own src: reads the file's exact bytes
    # directly (on the control node, where hof_state_dir was mounted) and
    # writes atomically (a same-filesystem temp file, then an atomic
    # rename into place) - no Jinja round-trip through the file's own
    # content at all. current.json is delivered under the snapshot's own
    # name state.json (see schemas/state-v1.schema.json / state.mjs's own
    # assertRenderedShape for the two different shapes).
    - name: Write all three snapshot files into the staging directory
      ansible.builtin.copy:
        src: "{{ hof_state_dir }}/{{ item.src }}"
        dest: "{{ hof_state_generation_staging_dir }}/{{ item.dest }}"
        owner: root
        group: root
        mode: "0444"
      loop:
        - { src: current.json, dest: state.json }
        - { src: topology.json, dest: topology.json }
        - { src: release-lock.json, dest: release-lock.json }

    # Fixed, argument-free POSIX sh - never a caller-built string. A
    # missing or empty file here means the copies above did not all land;
    # publishing an incomplete directory as an immutable record is
    # exactly what this whole rework exists to prevent.
    - name: Verify the staging directory is complete and every file is non-empty before publishing
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - >-
            set -eu;
            for f in state.json topology.json release-lock.json; do
              p="{{ hof_state_generation_staging_dir }}/$f";
              test -s "$p" || { echo "staging file $f missing or empty" >&2; exit 1; };
              head -c1 "$p" | grep -q '{' || { echo "staging file $f is not JSON" >&2; exit 1; };
            done
      changed_when: false

    # rename(2) of the whole directory - genuinely atomic on the same
    # filesystem, and `mv -T` (no-target-directory) never merges into or
    # descends an existing target. `creates:` makes this a no-op if the
    # final directory somehow already exists (it never should on this
    # branch - the stat above already gated it out), so a stray retry can
    # never turn the rename into a same-name overwrite.
    - name: Atomically publish the staging directory as generations/NNNNNN/
      ansible.builtin.command:
        argv:
          - mv
          - -T
          - "{{ hof_state_generation_staging_dir }}"
          - "{{ hof_state_generation_dir }}"
        creates: "{{ hof_state_generation_dir }}"

# The two pointer files. Order matters: topology.json first, then
# current.json last - state.mjs's own resolveBaseline() treats
# current.json's mere presence as "this installation is applied", so it
# must never appear before topology.json already does.
#
# Item 9 review fix (finding 2): a crash strictly between these two
# atomic writes leaves topology.json one generation AHEAD of
# current.json. That used to wedge resolveBaseline() forever with an
# indistinguishable-from-corruption digest mismatch, and --resume had no
# way to finish the commit. It is now recoverable: resolveBaseline()
# recognises "topology.json exactly one generation ahead of current.json"
# (the generation is carried in topology.json's own hof.generation
# ownership labels) as an interrupted commit and tells the operator to
# run `hofctl apply --resume`, and apply.mjs's resume path re-dispatches
# this idempotent state.commit (the immutable generation snapshot above
# is already published in full, so only these pointer writes are redone)
# to finish it.
- name: Atomically write topology.json
  ansible.builtin.copy:
    src: "{{ hof_state_dir }}/topology.json"
    dest: /var/lib/hof/state/topology.json
    owner: root
    group: root
    mode: "0644"

- name: Atomically write current.json (deliberately last)
  ansible.builtin.copy:
    src: "{{ hof_state_dir }}/current.json"
    dest: /var/lib/hof/state/current.json
    owner: root
    group: root
    mode: "0644"
