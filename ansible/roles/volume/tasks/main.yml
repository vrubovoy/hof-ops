---
- name: Assert this operation's own required variables are present
  ansible.builtin.assert:
    that:
      - hof_operation_id is not none
      - hof_volume_name is not none
      - hof_installation_id is not none
      - hof_generation is not none
    fail_msg: "volume role requires hof_operation_id, hof_volume_name, hof_installation_id, hof_generation - never invoked without them"

- name: Ensure this named, Hof-labeled Docker volume exists
  community.docker.docker_volume:
    name: "{{ hof_volume_name }}"
    labels:
      hof.managed: "true"
      hof.installation-id: "{{ hof_installation_id }}"
      hof.generation: "{{ hof_generation }}"
      hof.kind: volume
      hof.resource: "{{ hof_volume_name }}"
    state: present
