apiVersion: hof.dev/catalog/v1
services:
  - id: tor
    mandatory: true
    hostname: null
    # Tor ships no custom image of its own - it runs the stock, upstream
    # caddy:2-alpine image with a mounted Caddyfile. "gateway" pins that
    # upstream digest for reproducibility; it has no Hof-built signature,
    # SBOM, or provenance to attest (see the release-lock schema's
    # thirdParty flag).
    artifacts: [gateway]
    dependsOn: []
    volumes: [caddy-data]
    health:
      component: gateway
      path: /
  - id: schlussel
    mandatory: true
    hostname: auth
    # Published as ghcr.io/vrubovoy/schlussel (no -backend suffix - its
    # backend lives at the repo root, unlike the app services below).
    artifacts: [schlussel, schlussel-frontend]
    dependsOn: [tor]
    volumes: [schlussel-data]
    health:
      component: schlussel
      path: /health
    # schlussel is root-level (see the artifacts comment above), so its
    # compiled entry point has no backend/ prefix, unlike every other
    # service's database.command below.
    database:
      component: schlussel
      command: [node, dist/migrate.js]
      volume: schlussel-data
  - id: schloss
    mandatory: true
    hostname: null
    # Frontend-only service; published as ghcr.io/vrubovoy/schloss (no
    # -frontend suffix, unlike every other frontend image).
    artifacts: [schloss]
    dependsOn: [tor, schlussel]
    volumes: []
    health:
      component: schloss
      path: /
  - id: kuvert
    mandatory: false
    hostname: kuvert
    artifacts: [kuvert-backend, kuvert-frontend]
    dependsOn: [tor, schlussel]
    volumes: [kuvert-data]
    health:
      component: kuvert-backend
      path: /health
    database:
      component: kuvert-backend
      command: [node, backend/dist/migrate.js]
      volume: kuvert-data
  - id: tafel
    mandatory: false
    hostname: tafel
    artifacts: [tafel-backend, tafel-frontend]
    dependsOn: [tor, schlussel]
    volumes: [tafel-data]
    health:
      component: tafel-backend
      path: /health
    database:
      component: tafel-backend
      command: [node, backend/dist/migrate.js]
      volume: tafel-data
  - id: zettel
    mandatory: false
    hostname: zettel
    artifacts: [zettel-backend, zettel-frontend]
    dependsOn: [tor, schlussel]
    volumes: [zettel-data]
    health:
      component: zettel-backend
      path: /health
    database:
      component: zettel-backend
      command: [node, backend/dist/migrate.js]
      volume: zettel-data
  - id: glocke
    mandatory: false
    hostname: glocke
    artifacts: [glocke-backend, glocke-frontend]
    dependsOn: [tor, schlussel]
    volumes: [glocke-data]
    health:
      component: glocke-backend
      path: /ready
    database:
      component: glocke-backend
      command: [node, backend/dist/migrate.js]
      volume: glocke-data
  - id: schrank
    mandatory: false
    hostname: schrank
    artifacts: [schrank-backend, schrank-frontend]
    dependsOn: [tor, schlussel]
    volumes: [schrank-data]
    health:
      component: schrank-backend
      path: /ready
    database:
      component: schrank-backend
      command: [node, backend/dist/migrate.js]
      volume: schrank-data
  - id: herold
    mandatory: false
    hostname: herold
    artifacts: [herold-backend, herold-frontend]
    dependsOn: [tor, schlussel]
    volumes: [herold-data]
    health:
      component: herold-backend
      path: /ready
    database:
      component: herold-backend
      command: [node, backend/dist/migrate.js]
      volume: herold-data
  - id: wachter
    mandatory: false
    hostname: null
    # The API and its private Docker agent run the same image
    # (backend/Dockerfile) as two different Compose services/commands -
    # published as the single ghcr.io/vrubovoy/wachter-backend, not two
    # separate images.
    artifacts: [wachter-backend]
    dependsOn: [schloss]
    volumes: []
    health:
      component: wachter-backend
      path: /ready
