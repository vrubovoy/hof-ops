apiVersion: hof.dev/release-selection/v1
release: 1.0.0
minimumHofctlVersion: 0.1.0
catalog: catalog/services-v1.yaml
composeTemplate: scripts/render-topology.mjs
# Versions independently of the platform release, like every other
# component here - see ansible/README.md's own "Versioning" section for
# why its tag is ee-vX.Y.Z, never plain vX.Y.Z.
ansibleEnvironment:
  repository: vrubovoy/hof-ops
  version: 0.1.6
  image: ghcr.io/vrubovoy/hof-ops-ee:v0.1.6
  workflowIdentity: https://github.com/vrubovoy/hof-ops/.github/workflows/execution-environment.yml@refs/tags/ee-v0.1.6
  oidcIssuer: https://token.actions.githubusercontent.com
  requiredChecks: [ansible]
components:
  gateway:
    image: docker.io/library/caddy:2.10.2-alpine
    thirdParty: true
    trust:
      policy: digest-only
      limitation: Upstream image has no Hof workflow identity; only the selected registry digest is trusted.
  schlussel:
    repository: vrubovoy/schlussel
    version: 1.0.0
    image: ghcr.io/vrubovoy/schlussel:v1.0.0
    workflowIdentity: https://github.com/vrubovoy/schlussel/.github/workflows/test.yml@refs/tags/v1.0.0
    oidcIssuer: https://token.actions.githubusercontent.com
    requiredChecks: [backend, frontend]
    configSchema: 1
    databaseArtifact: true
    database: { from: 1, to: 1, rollbackCompatible: true }
  schlussel-frontend:
