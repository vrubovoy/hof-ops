apiVersion: hof.dev/release-selection/v1
release: 0.2.2
minimumHofctlVersion: 0.1.0
catalog: catalog/services-v1.yaml
composeTemplate: scripts/render-topology.mjs
ansibleEnvironment:
  repository: vrubovoy/hof-ops
  version: 0.1.6
  image: ghcr.io/vrubovoy/hof-ops-ee:v0.1.6
