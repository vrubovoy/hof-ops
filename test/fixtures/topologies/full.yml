apiVersion: hof.dev/v1alpha1
release: 1.0.0
target: { host: full.example.com, user: deploy }
domains: { base: full.example.com }
tls: { mode: acme-http01, email: admin@example.com }
services:
  kuvert: { enabled: true }
  tafel: { enabled: true }
  zettel: { enabled: true }
  glocke: { enabled: true }
  schrank: { enabled: true }
  herold: { enabled: true }
  wachter: { enabled: true }
features:
  browserPush: { enabled: true, subject: mailto:admin@example.com }
backup:
  schedule: "03:00"
  destinations:
    - { name: local, type: local, path: /var/backups/hof, secretRef: backup-local }
  retention: { daily: 7, weekly: 4, monthly: 6 }
